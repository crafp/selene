# Options de la session « Game Mode » (Steam Big Picture dans gamescope).
# Pour les changer rien que pour toi : copie ce fichier dans ~/.config/selene/gamemode.conf
#
# Laisse vide pour utiliser la résolution et la fréquence natives de l'écran.
# Exemples : "-W 2880 -H 1800 -r 120"   "--hdr-enabled"   "--adaptive-sync"
GAMESCOPE_OPTS="--adaptive-sync"
