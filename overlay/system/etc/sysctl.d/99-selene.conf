# @OS_NAME@ — réglages noyau pour un bureau et des jeux fluides (16 Go de RAM + zram)

# Mémoire : zram est rapide, on l'utilise volontiers (valeurs conseillées par le wiki Arch pour zram)
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
vm.vfs_cache_pressure = 50

# Certains jeux Windows (via Proton) ouvrent énormément de zones mémoire
vm.max_map_count = 2147483642

# Évite des ralentissements dans certains jeux (verrous mémoire mal alignés)
kernel.split_lock_mitigate = 0
kernel.nmi_watchdog = 0

# Éditeurs de code et gros projets web (VS Code, node...)
fs.inotify.max_user_watches = 524288

# Réseau : file d'attente équitable + BBR (moins de latence en ligne)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
