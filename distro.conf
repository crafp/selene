# distro.conf — l'identité de ta distribution.
# Change ces valeurs pour renommer l'OS (aucun espace autour des « = »).
OS_NAME="SeleneOS"
OS_ID="selene"
OS_TAGLINE="Arch Linux en mode nuit : rapide, fluide, prêt pour le jeu"
OS_URL="https://github.com/TON-PSEUDO/selene"

# Réglages par défaut de l'installateur (France)
DEFAULT_LOCALE="fr_FR.UTF-8"
DEFAULT_KEYMAP="fr"
DEFAULT_TIMEZONE="Europe/Paris"
DEFAULT_HOSTNAME="selene"
